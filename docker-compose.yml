version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: scribehealth_postgres
    restart: always
    environment:
      POSTGRES_USER: scribe_user
      POSTGRES_PASSWORD: scribe_password
      POSTGRES_DB: scribehealth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribe_user -d scribehealth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: scribehealth_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
